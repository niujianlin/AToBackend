# 生产部署编排：放到服务器 DEPLOY_PATH 下，与 .env 同目录
# 镜像地址由 GitHub Actions 以 ATO_IMAGE 环境变量注入，例如：
#   ATO_IMAGE=ghcr.io/<owner>/ato-account:v1.0.0
services:
  ato-account:
    image: ${ATO_IMAGE:?ATO_IMAGE is required}
    container_name: ato-account
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内固定连宿主机的 MySQL / Redis（或改成外部地址）
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ato_account}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # 多实例部署时必须为每个实例分配不同值
      SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID:-1}
      # 注意：application.yml 中 ato.sms.mock 目前是硬编码 true，
      # 接入真实短信商后需改为 ${ATO_SMS_MOCK:false} 才能生效
    ports:
      - '${APP_PORT:-8080}:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', '-X', 'POST', 'http://127.0.0.1:8080/api/v1/auth/login']
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    deploy:
      resources:
        limits:
          memory: 1g
